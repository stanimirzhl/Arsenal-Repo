<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <form class="m-3">

        <h1>
            Регистрационна форма за ученици
        </h1>

        <div class="mb-3">
            <label class="form-label">
                Име и фамилия
            </label>
            <input type="text" placeholder="Въведете име" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">
                Въведете имейл
            </label>
            <input type="email" placeholder="Въведете имейл" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">
                Парола
            </label>
            <input type="password" placeholder="" class="form-control">
        </div>

        <div class="mb-3">
            <label class="form-label">
                Изберете клас
            </label>
            <select class="form-control form-select">
                <option value="" selected>Изберете</option>
                <option value="">7А</option>
                <option value="">7Б</option>
                <option value="">8А</option>
                <option value="">8Б</option>
            </select>
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input">
            <label class="form-check-label">Съгласен/на съм с правилата</label>
        </div>

        <div class="mb-3">
            <button type="submit" class="btn btn-primary btn-sm">Регистрация</button>
        </div>
    </form>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
