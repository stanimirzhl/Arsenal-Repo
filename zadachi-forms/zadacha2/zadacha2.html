<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadacha-2</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>

    <form>
        <label>
            *First time playing Escape Room?
        </label>
        <select>
            <option value="">Select an option</option>
            <option value="">Yes</option>
            <option value="">No</option>
        </select>

        <div class="form-div-1">
            <label>
                *Which game you played
            </label>

            <div class="options">
                <div>
                    <label>
                        <input type="checkbox">Exodus
                    </label>
                </div>

                <div>
                    <label>
                        <input type="checkbox">Alcatraz
                    </label>
                </div>

                <div>
                    <label>
                        <input type="checkbox">Aokigahara
                    </label>
                </div>

                <div>
                    <label>
                        <input type="checkbox">Mausoleum
                    </label>
                </div>

                <div>
                    <label>
                        <input type="checkbox">Castiglione
                    </label>
                </div>
            </div>
        </div>

        <div class="form-div-1">
            <label>
                Will you recommend the game to your friends?
            </label>

            <div class="options">
                <div>
                    <label for="Yes">
                        <input type="radio" name="question" value="Yes" id="Yes">Yes
                    </label>
                </div>
                <div>
                    <label for="Maybe">
                        <input type="radio" name="question" value="Maybe" id="Maybe">Maybe
                    </label>
                </div>
                <div>
                    <label for="No">
                        <input type="radio" name="question" value="Yes" id="No">No
                    </label>
                </div>
            </div>
        </div>

        <div class="form-div-1">
            <h2>
                Any comments or suggestions?
            </h2>

            <textarea placeholder="Enter your comment here..." rows="5" cols="20"></textarea>

            <div class="buttons">
                <button type="submit">Submit</button>
            </div>
        </div>
    </form>
</body>

</html>
