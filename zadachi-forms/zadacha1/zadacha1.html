<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadacha-1</title>
    <link href="style.css" rel="stylesheet">
</head>

<body>
    <p>
        Let us know how we can improve our service
    </p>

    <div class="form-options">
        <label>
            Name:
        </label>
        <input type="text">
    </div>

    <div class="form-options">
        <label>
            Email:
        </label>
        <input type="text">
    </div>

    <div class="form-options">
        <label>
            Date of birth:
        </label>
        <input type="date">
    </div>

    <div class="form-options">
        <label>
            Handphone:
        </label>
        <input type="text" placeholder="Phone Number">
    </div>

    <label>
        Will you recommend the game to your friends?
    </label>
    <div class="radio-group">

        <div class="radio-group">
            <label for="yes"><input type="radio" name="question" value="Yes" id="yes">Yes</label>
        </div>

        <div class="radio-group">
            <label for="maybe"><input type="radio" name="question" value="Maybe" id="maybe">Maybe</label>
        </div>

        <div class="radio-group">
            <label for="no"><input type="radio" name="question" value="No" id="no">No</label>
        </div>
    </div>

    <div class="form-options">
        <button type="submit">Submit</button>
    </div>
</body>

</html>
