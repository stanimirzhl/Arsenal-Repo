<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoftUni Store</title>
</head>
<body>
    <table border="1">
        <tr>
            <td>
                <strong>Name / Description</strong>
            </td>
            <td>
                <strong>Qty.</strong>
            </td>
            <td>
                <strong>Price</strong>
            </td>
            <td>
                <strong>Cost</strong>
            </td>
        </tr>
        <tr>
            <td>
                Paperclips
            </td>
            <td>
                1000
            </td>
            <td>
                0.01
            </td>
            <td>
                10.00
            </td>
        </tr>
        <tr>
            <td>
                Staples(box)
            </td>
            <td>
                100
            </td>
            <td>
                1.00
            </td>
            <td>
                100.00
            </td>
        </tr>
        <tr>
            <th colspan="3">
                <strong>Subtotal</strong>
            </th>
            <td>
                $110.00
            </td>
        </tr>
        <tr>
            <th colspan="2">
                <strong>
                    Tax
                </strong>
            </th>
            <td>8%</td>
            <td>
                $8.80
            </td>
        </tr>
        <tr>
            <th colspan="3">
                <strong>
                    Grand Total
                </strong>
            </th>
            <td>
                $118.80
            </td>
        </tr>
        <tr>
            <th colspan="4">
                &copy; <i>2017 - SoftUni Store</i>
            </th>
        </tr>
    </table>
</body>
</html>
